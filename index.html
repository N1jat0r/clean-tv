<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Clean TV</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg"></div>
  <div id="hero-glow"></div>
  <div class="hero-art" id="hero-art"></div>

  <main id="home">
    <header>
      <div class="chip" id="adchip"></div>
      <div class="clock" id="time"></div>
    </header>
    <section class="hero">
      <div class="hero-text">
        <div class="eyebrow" id="hero-cat"></div>
        <h1 id="hero-title"></h1>
        <p id="hero-sub"></p>
      </div>
    </section>
    <div class="grid" id="grid"></div>
  </main>

  <div class="toast" id="toast"></div>

  <div class="modal" id="settings"><div class="sheet"></div></div>
  <div class="modal" id="menu"><div class="sheet"></div></div>
  <div class="modal" id="editor"><div class="sheet"></div></div>

  <script src="app.js"></script>
</body>
</html>
